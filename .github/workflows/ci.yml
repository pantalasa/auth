name: GH-Actions

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth_service_build:
    runs-on: lunar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install dependencies
        run: |
          python3 -m venv ./venv
          ./venv/bin/pip wheel -r requirements.txt --wheel-dir=wheels
          ./venv/bin/pip install --no-index --find-links=wheels -r requirements.txt
          ./venv/bin/pip install pytest pytest-cov

      # Emit coverage.xml (Cobertura) so the lunar python test-coverage collector
      # records test execution (.testing.source) + coverage (.testing.coverage).
      - name: Run tests
        run: ./venv/bin/python -m pytest --cov=src --cov-report=xml src/
