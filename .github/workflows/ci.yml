name: GH-Actions
on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"
env:
    CARGO_TERM_COLOR: always
jobs:
    auth_service_build:
        runs-on: localdev-nacho3
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                clean: true
            - name: Install dependencies
              run: |
                cat Earthfile
                pip install wheel
                pip wheel -r requirements.txt --wheel-dir=wheels
            - name: Run tests
              run: "pip install --no-index --find-links=wheels -r requirements.txt \npython -m pytest\n"
