name: GH-Actions
on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"
env:
    CARGO_TERM_COLOR: always
jobs:
    auth_service_build:
        runs-on: localdev-e2e-test-26937757864-e2e
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                clean: true
            - name: Install dependencies
              run: "python3 -m venv ./venv\n./venv/bin/pip wheel -r requirements.txt --wheel-dir=wheels\n./venv/bin/pip install --no-index --find-links=wheels -r requirements.txt \n./venv/bin/pip install pytest\n"
            - name: Run tests
              run: |
                ./venv/bin/python -m pytest
